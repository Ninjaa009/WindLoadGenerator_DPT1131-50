// ---------- Design critical-value summary ----------
function DesignSummary(props){
  const {dir,setDir,dirTrans,dirParallel,GRAV,C,mono}=props;
  const kg=(v)=>(v/GRAV).toFixed(1);
  const active = dir==="trans" ? dirTrans : dirParallel;
  const dirLabel = dir==="trans" ? "ลมตั้งฉากสันหลังคา (Transverse)" : "ลมขนานสันหลังคา (Longitudinal)";
  const lcPair = dir==="trans" ? "LC1 (ภายในบวก) vs LC2 (ภายในลบ)" : "LC3 (ภายในบวก) vs LC4 (ภายในลบ)";
  const th=(t)=>e("th",{style:{textAlign:"left",fontWeight:600,padding:"6px 8px",fontSize:11,color:C.ink,borderBottom:`1px solid ${C.border}`,background:C.head}},t);
  const td=(children,color,bold)=>e("td",{style:{padding:"6px 8px",color:color||C.ink,fontWeight:bold?600:400,whiteSpace:"nowrap"}},children);

  const dirBtn=(id,label)=>{
    const on = dir===id;
    return e("button",{key:id,onClick:()=>setDir(id),style:{
      border:`1px solid ${on?C.ink:C.border}`,background:on?C.ink:"#fff",color:on?"#fff":C.ink,
      padding:"8px 18px",fontSize:14,fontWeight:on?600:400,borderRadius:6,cursor:"pointer",marginRight:8}},label);
  };

  return e("div",{style:{maxWidth:900,margin:"0 auto"}},
    e("div",{style:{fontSize:13,color:C.ink2,marginBottom:16,lineHeight:1.7,background:C.sheet,border:`1px solid ${C.borderLt}`,borderRadius:6,padding:"12px 16px"}},
      "เลือกทิศทางลมก่อน แล้วดูว่าแต่ละโซนมี ",
      e("b",{style:{color:C.pos}},"แรงกดวิกฤต")," และ ",e("b",{style:{color:C.neg}},"แรงดูดวิกฤต"),
      " เกิดจาก Load Case ไหน — เทียบเฉพาะ 2 LC ของทิศที่เลือก (คงความสัมพันธ์ในเฟรมเดียวกัน ไม่หยิบข้ามทิศ)"),

    // direction filter (big)
    e("div",{style:{marginBottom:16,display:"flex",alignItems:"center",flexWrap:"wrap"}},
      dirBtn("trans","ลมตั้งฉากสันหลังคา"),
      dirBtn("parallel","ลมขนานสันหลังคา"),
      e("span",{style:{fontSize:12,color:C.ink3,marginLeft:6,fontFamily:mono}},"เทียบ: "+lcPair)),

    e("div",{style:{fontSize:13,fontWeight:600,color:C.ink,marginBottom:8}},"ค่าวิกฤตต่อโซน — "+dirLabel),
    e("div",{style:{overflowX:"auto",border:`1px solid ${C.border}`,borderRadius:6}},
      e("table",{style:{width:"100%",fontSize:13,fontFamily:mono,borderCollapse:"collapse"}},
        e("thead",null,e("tr",null,
          th("โซน"),th("แรงกดวิกฤต (kg/m²)"),th("จาก LC"),th("แรงดูดวิกฤต (kg/m²)"),th("จาก LC"))),
        e("tbody",null, active.crit.map((c)=>{
          const hasP=c.press && c.press.net>=0;
          const hasS=c.suction && c.suction.net<0;
          return e("tr",{key:c.zone,style:{borderTop:`1px solid ${C.borderLt}`}},
            td(c.zone,C.ink,true),
            td(hasP? "+"+kg(c.press.net)+" (กด)" : "— ไม่มีแรงกด", hasP?C.pos:C.ink3, hasP),
            td(hasP? c.press.lc+" · "+c.press.name : "—", C.ink2),
            td(hasS? kg(c.suction.net)+" (ดูด)" : "— ไม่มีแรงดูด", hasS?C.neg:C.ink3, hasS),
            td(hasS? c.suction.lc+" · "+c.suction.name : "—", C.ink2));
        })))),

    // full detail: every zone x its 2 LCs for the chosen direction
    e("div",{style:{marginTop:20,fontSize:13,fontWeight:600,color:C.ink,marginBottom:8}},"รายละเอียดทุกโซน — ค่าใน 2 LC ของทิศนี้"),
    e("div",{style:{overflowX:"auto",border:`1px solid ${C.border}`,borderRadius:6}},

          const cellVal=(x)=>e("td",{style:{padding:"6px 8px",color:x.net>=0?C.pos:C.neg,fontWeight:600,whiteSpace:"nowrap"}},
            (x.net>=0?"+":"")+kg(x.net)+" ("+(x.net>=0?"กด":"ดูด")+")");
          return e("tr",{key:z,style:{borderTop:`1px solid ${C.borderLt}`}},

        })))),

    e("div",{style:{fontSize:11,color:C.ink3,marginTop:14,lineHeight:1.7}},

}

// ---------- Design critical-value summary ----------
function App(){
  const [tab,setTab]=useState("calc");
  const [dir,setDir]=useState("trans");
  const [province,setProvince]=useState("นครสวรรค์");
  const [limitState,setLimitState]=useState("strength");
  const [exposure,setExposure]=useState("B");
  const [importance,setImportance]=useState("ปกติ");
  const [cpiCase,setCpiCase]=useState("3");
  const [useTf,setUseTf]=useState(false);
  const [tfTouched,setTfTouched]=useState(false);
  const [Heave,setHeave]=useState(6.0);
  const [Hridge,setHridge]=useState(7.5);
  const [B,setB]=useState(20);
  const [L,setL]=useState(40);
  const [roofSlopeKey,setRoofSlopeKey]=useState("0-5");

  const group = (PROVINCES.find((p)=>p[0]===province)||[])[1]||"1";
  const g = GROUPS[group]; const v50=g.v50, tf=g.tf;
  // T_F: default ติ๊กเมื่อเลือกอาคาร "สูงมาก" แต่ผู้ใช้แก้เองได้ (ถ้ายังไม่เคยแตะ checkbox)
  const effectiveUseTf = tfTouched ? useTf : (importance==="สูงมาก");
  const Vbar = effectiveUseTf ? tf*v50 : v50;
  const q = 0.5*RHO*Vbar*Vbar;

  const rise=Hridge-Heave, run=B/2;
  const roofSlopeRad = run>0 ? Math.atan(rise/run) : 0;
  const roofSlopeDeg = roofSlopeRad*180/Math.PI;
  const hRaw = (Heave + Hridge)/2;   // mean roof height = ค่าเฉลี่ยชายคา-สันหลังคา
  const h = Math.max(hRaw,6);

  const exp = EXPOSURE[exposure];
  const CeRaw = exp.raw(h);
  const Ce = exp.calc(h);
  const CeClamped = (CeRaw!==Ce);

  const iwStrength = IMPORTANCE.find((i)=>i.key===importance).iw;
  const iw = limitState==="serviceability" ? 0.75 : iwStrength;  // ตาราง 2-2: ด้านการใช้งานใช้ 0.75 ทุกประเภท

  const narrowSide=Math.min(B,L);
  const zA=0.1*narrowSide, zB=0.4*h;
  const zEdgeRaw=Math.min(zA,zB);
  const zMin1=0.04*narrowSide;
  const zEdge=Math.max(zEdgeRaw,zMin1,1);
  const yEdge=Math.max(6,2*zEdge);

  const cpiVals = CPI_CASES.find((c)=>c.key===cpiCase).values;
  const piLo=cpiVals[0], piHi=cpiVals[1];
  const piA=iw*q*Ce*CGI*piLo;
  const piB=iw*q*Ce*CGI*piHi;
  // NOTE: ตาราง Cg·Cp รวม Cg ไว้แล้ว จึงไม่คูณ CG ซ้ำใน p (ต่างจาก pi ที่ Cpi เป็นค่าเดี่ยว ต้องคูณ Cgi)
  const pFactor=iw*q*Ce;

  const case1Row=CASE1_TABLE[roofSlopeKey];
  const case1Results=CASE1_ZONES.map((zone,i)=>{const cgcp=case1Row[i];const p=pFactor*cgcp;return {zone,cgcp,p,netA:p-piA,netB:p-piB};});
  const case2Results=CASE2_ZONES.map((zone,i)=>{const cgcp=CASE2_VALUES[i];const p=pFactor*cgcp;return {zone,cgcp,p,netA:p-piA,netB:p-piB};});

  // ---- ค่าวิกฤตแยกตามทิศทางลม (เทียบเฉพาะ 2 LC ของทิศนั้น) ----
  // ตั้งฉาก: LC1 (ภายในบวก, netB) vs LC2 (ภายในลบ, netA)
  // ขนาน:   LC3 (ภายในบวก, netB) vs LC4 (ภายในลบ, netA)
  function buildDir(res, lcPos, lcNeg){
    const zmap={};
    res.forEach((r)=>{
      zmap[r.zone]=[
        {lc:lcPos.id,name:lcPos.name,net:r.netB},
        {lc:lcNeg.id,name:lcNeg.name,net:r.netA},
      ];
    });
    const zones=Object.keys(zmap);
    const crit=zones.map((z)=>{
      const en=zmap[z]; let press=null, suction=null;
      en.forEach((x)=>{
        if(press===null || x.net>press.net) press=x;
        if(suction===null || x.net<suction.net) suction=x;
      });
      return {zone:z, press, suction};
    });
    return {zmap, zones, crit};
  }
  const dirTrans = buildDir(case1Results, {id:"LC1",name:"ภายในบวก"}, {id:"LC2",name:"ภายในลบ"});
  const dirParallel = buildDir(case2Results, {id:"LC3",name:"ภายในบวก"}, {id:"LC4",name:"ภายในลบ"});

  const f=(x,n)=> (n===undefined?x.toFixed(2):x.toFixed(n));

  // ---- layout ----
  return e("div",{style:{background:C.bg,minHeight:"100%",color:C.ink,fontFamily:"ui-sans-serif, system-ui, sans-serif",padding:"20px"}},
    e("div",{style:{maxWidth:1080,margin:"0 auto"}},
      e("header",{style:{marginBottom:20,borderBottom:`1px solid ${C.border}`,paddingBottom:14}},
        e("div",{style:{fontSize:11,letterSpacing:"0.05em",color:C.ink2}},"WIND LOAD GENERATOR · มยผ. 1311-50 · LOW-RISE BUILDING"),
        e("h1",{style:{fontSize:24,fontWeight:600,margin:"4px 0 0",color:C.ink}},"เครื่องคำนวณแรงลมสถิตเทียบเท่า"),
        e("p",{style:{fontSize:13,margin:"4px 0 0",color:C.ink2}},"คำนวณ q, Cₑ, pᵢ, p, p_net ครบ 8 โซน (ลมตั้งฉากสันหลังคา) และ 12 โซน (ลมขนานสันหลังคา) พร้อม calculation sheet"),
        e("div",{style:{display:"flex",gap:4,marginTop:14}},
          [["calc","เครื่องคำนวณ"],["design","สรุปค่าออกแบบ"],["ref","เอกสารอ้างอิงสูตร"]].map((t)=>
            e("button",{key:t[0],onClick:()=>setTab(t[0]),style:{
              border:`1px solid ${C.border}`,borderBottom:tab===t[0]?`2px solid ${C.ink}`:`1px solid ${C.border}`,
              background:tab===t[0]?C.panel:C.head,color:tab===t[0]?C.ink:C.ink2,
              padding:"7px 16px",fontSize:13,fontWeight:tab===t[0]?600:400,borderRadius:"4px 4px 0 0",cursor:"pointer"}},t[1])))),

      tab==="ref" ? e(ReferenceDoc) :
      tab==="design" ? e(DesignSummary,{dir:dir,setDir:setDir,dirTrans:dirTrans,dirParallel:dirParallel,GRAV:GRAV,C:C,mono:mono}) :
      e(React.Fragment,null,
      e("div",{style:{display:"grid",gridTemplateColumns:"340px 1fr",gap:20,alignItems:"start"}},
        // input column
        e("div",{style:{display:"flex",flexDirection:"column",gap:20}},
          e(Panel,{title:"1. ที่ตั้งโครงการ"},
            e(Field,{label:"จังหวัด"}, e(Sel,{value:province,onChange:(ev)=>setProvince(ev.target.value)}, PROVINCES.map((p)=>e("option",{key:p[0],value:p[0]},p[0])))),
            e("div",{style:{fontSize:12,fontFamily:mono,color:C.ink2}},"กลุ่ม: ",e("b",{style:{color:C.ink}},group)," · V₅₀=",e("b",{style:{color:C.ink}},v50)," m/s · T_F=",e("b",{style:{color:C.ink}},tf)),
            e(Field,{label:"สภาวะจำกัด",hint:"ใช้เลือกชุดค่า Iw (ด้านกำลัง / ด้านการใช้งาน=0.75)"}, e(Sel,{value:limitState,onChange:(ev)=>setLimitState(ev.target.value)},
              e("option",{value:"strength"},"ด้านกำลัง (Strength)"),
              e("option",{value:"serviceability"},"ด้านการใช้งาน (Serviceability)"))),
            e("div",{style:{border:`1px solid ${C.borderLt}`,borderRadius:4,padding:"8px 10px",background:C.sheet}},
              e("label",{style:{display:"flex",alignItems:"flex-start",gap:8,cursor:"pointer",fontSize:13,color:C.ink}},
                e("input",{type:"checkbox",checked:effectiveUseTf,style:{marginTop:2},onChange:(ev)=>{setTfTouched(true);setUseTf(ev.target.checked);}}),
                e("span",null,"รวมค่าประกอบไต้ฝุ่น T_F  ",

            e(Field,{label:"ลักษณะช่องเปิด (Cpi)"}, e(Sel,{value:cpiCase,onChange:(ev)=>setCpiCase(ev.target.value)}, CPI_CASES.map((c)=>e("option",{key:c.key,value:c.key},c.label))))),
          e(Panel,{title:"3. เรขาคณิตอาคาร (m)"},
            e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}},

        ),
        // results column

                case2Results.map((r)=>
                  "Zone "+r.zone.padEnd(3)+": p = "+f(pFactor/GRAV,1)+"×("+r.cgcp.toFixed(2)+") = "+f(r.p/GRAV,1).padStart(7)+" ("+signLabel(r.p)+")"+
                  "  |  p_net = "+f(r.netA/GRAV,1).padStart(7)+" ("+signLabel(r.netA)+")"+
                  "  /  "+f(r.netB/GRAV,1).padStart(7)+" ("+signLabel(r.netB)+")"
                ).join("\n"))
            ),
            e("div",{style:{fontSize:11,color:C.ink2,marginTop:8,borderTop:`1px solid ${C.borderLt}`,paddingTop:8}},
              "หน่วยทั้งหมดเป็น kg/m² (แปลงจาก N/m² โดยหารด้วย 9.81) · ค่า p_net สองชุดคือผลจาก Cpi ต่ำ/สูง ให้เลือกค่าวิกฤตสุดของแต่ละโซนไปออกแบบ")
          ))
      )
      ),
      e("div",{style:{textAlign:"center",fontSize:11,color:C.ink3,marginTop:20,paddingBottom:20}},
        "เครื่องมือช่วยคำนวณเบื้องต้น — ผู้ใช้ต้องตรวจสอบตามมาตรฐาน มยผ. 1311-50 ก่อนนำไปออกแบบจริง")
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(e(App));
</script>
